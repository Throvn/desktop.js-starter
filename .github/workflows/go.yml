# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Build linux x86_64
        run: GOARCH=amd64 GOOS=linux go build -o djs-linux-amd64

      - name: Build linux aarch64
        run: GOARCH=arm64 GOOS=linux go build -o djs-linux-arm64

      - name: Build macOS aarch64
        run: GOARCH=arm64 GOOS=darwin go build -o djs-darwin-arm64

      - name: Build macOS x86_64
        run: GOARCH=amd64 GOOS=darwin go build -o djs-darwin-amd64

      - name: Create/Update "latest" Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}a
          name: ${{ env.VERSION }}
          overwrite_files: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
